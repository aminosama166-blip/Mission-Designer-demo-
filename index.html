<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mission Designer · Team DrX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--ac:#5fd0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#070a1a;overflow:hidden;font:15px/1.5 Barlow,system-ui,sans-serif;color:#cfe0ff}
#c{position:fixed;inset:0;width:100%;height:100%}
#ln{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#mk{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px;border-radius:50%;border:2px solid var(--ac);pointer-events:none;opacity:0;transition:opacity .4s;animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(95,208,255,.7)}100%{box-shadow:0 0 0 14px rgba(95,208,255,0)}}
#cw{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 5vw;pointer-events:none}
#card{pointer-events:auto;width:min(390px,90vw);padding:22px 24px;border-radius:18px;background:rgba(13,19,48,.66);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(44,61,122,.95);box-shadow:0 0 40px rgba(95,208,255,.14);transition:opacity .45s,transform .6s}
#card.h{opacity:0;transform:translateY(16px)}
.tg{font:500 11px Orbitron,sans-serif;letter-spacing:.18em;color:var(--ac)}
#card h2{font:700 24px Orbitron,sans-serif;margin:6px 0 10px;color:#fff}
#card p{margin:0 0 12px;color:#c4d4f5}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st div{background:rgba(95,208,255,.08);border:1px solid rgba(95,208,255,.22);border-radius:10px;padding:6px 10px}
.st b{display:block;font:700 15px Orbitron,sans-serif;color:#fff}.st span{font-size:11px;color:#8fb0e8;letter-spacing:.04em}
#nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:999px;background:rgba(13,19,48,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(120,180,255,.3)}
#nav button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(120,180,255,.4);background:rgba(47,85,212,.35);color:#fff;font-size:20px;cursor:pointer}
#dots{display:flex;gap:5px}#dots i{width:7px;height:7px;border-radius:50%;background:#2c3d7a;transition:.3s}#dots i.on{background:var(--ac);transform:scale(1.5)}
#ct{font:500 11px Orbitron,sans-serif;color:#8fb0e8;min-width:44px;text-align:center}
@media(max-width:720px){#cw{align-items:flex-end;justify-content:center;padding:0 0 84px}#card{padding:14px 16px}#card h2{font-size:19px}#card p{font-size:13px}#dots{display:none}}

#card.w{width:min(700px,92vw)}#card{max-height:calc(100vh - 118px);overflow:auto;scrollbar-width:thin}
.bl{list-style:none;margin:0 0 12px;padding:0}.bl li{position:relative;padding-left:18px;margin-bottom:7px;color:#c4d4f5}
.bl li:before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.fc{background:rgba(95,208,255,.1);border:1px solid rgba(95,208,255,.35);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.fc b{font:700 26px Orbitron,sans-serif;color:#fff;display:block;line-height:1.1}.fc span{display:block;color:#c4d4f5;margin-top:4px}
a{color:var(--ac);text-decoration:none;border-bottom:1px dotted rgba(95,208,255,.6)}a:hover{color:#fff}
.sm{font-size:11px;color:#8fb0e8}.sm a{font-size:11px}
.ns{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px;counter-reset:n}
.ns li{counter-increment:n;display:flex;gap:10px;align-items:flex-start;color:#c4d4f5}
.ns li:before{content:counter(n);flex:none;width:24px;height:24px;border-radius:50%;background:rgba(47,85,212,.45);border:1px solid rgba(120,180,255,.5);color:#fff;font:700 12px/22px Orbitron,sans-serif;text-align:center}
.ns b{color:#fff;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.06em}
.ds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.ds div{background:rgba(95,208,255,.08);border:1px solid rgba(95,208,255,.22);border-radius:10px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips a{display:inline-block;padding:9px 12px;min-height:38px;border:1px solid rgba(95,208,255,.35);border-radius:999px;background:rgba(95,208,255,.09);color:#e6f1ff;font:600 12px/1.2 Barlow,sans-serif}.chips a:active{background:rgba(95,208,255,.25)}
.ds div:last-child:nth-child(odd){grid-column:1/-1}.ds b{display:block;font:700 14px Orbitron,sans-serif;color:#fff}.ds span{display:block;font-size:11px;color:#8fb0e8}
.ims{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ims img{width:100%;display:block;border-radius:10px;border:1px solid rgba(120,180,255,.4);box-shadow:0 0 22px rgba(60,140,255,.25)}
.ims span{display:block;margin-top:5px;font:500 11px Orbitron,sans-serif;letter-spacing:.1em;color:var(--ac)}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.who div{background:rgba(95,208,255,.08);border:1px solid rgba(95,208,255,.22);border-radius:10px;padding:8px 10px}
.who b{display:block;font:700 13px Orbitron,sans-serif;color:#fff;margin-bottom:3px}.who span{font-size:12px;color:#c4d4f5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two h3{margin:0 0 6px;font:500 11px Orbitron,sans-serif;letter-spacing:.16em;color:var(--ac)}
#card h2{background:linear-gradient(90deg,#5fd0ff,#9aa4ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(120,140,255,.35))}
.ns li:before{background:linear-gradient(#6fd8ff,#2f7bd4)!important;color:#04101f!important;border:0!important}
.fc{background:rgba(13,19,48,.7);border-color:#2c3d7a}.fc b{color:#4ade80}
.ims.one{grid-template-columns:1fr}.ims.one img{width:62%}.ims.t3{grid-template-columns:1fr 1fr 1fr;gap:8px}.ims.t3 span{font-size:9px}
.st.r4{grid-template-columns:repeat(4,1fr)}.st.r4 b{font-size:20px}.st.r4 span{font-size:10px}
.ims img{cursor:zoom-in}#lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,6,20,.92);cursor:zoom-out}#lb img{max-width:94vw;max-height:90vh;border-radius:12px;border:1px solid #2c3d7a;box-shadow:0 0 40px rgba(95,208,255,.25)}
.nm{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.nm i{font-style:normal;font:600 12px Barlow,sans-serif;color:#cfe0ff;background:rgba(95,208,255,.1);border:1px solid #2c3d7a;border-radius:999px;padding:3px 10px}
@media(max-width:720px){.ims,.two,.ds{grid-template-columns:1fr}.who{grid-template-columns:1fr}#card{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;background:#00010a}body{background:transparent!important}#brand{position:fixed;left:3vw;top:calc(3.2vh + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:1.4vw;pointer-events:none}#brand img{height:clamp(34px,5.4vw,92px);width:auto;filter:drop-shadow(0 0 10px rgba(95,208,255,.4))}#brand i{width:1px;align-self:stretch;background:linear-gradient(transparent,rgba(160,200,255,.7),transparent)}#brand b{display:block;font:italic 700 clamp(14px,2.3vw,38px)/1.05 Orbitron,sans-serif;letter-spacing:.02em;color:#eaf3ff;text-shadow:0 0 16px rgba(95,208,255,.4)}#brand span{display:block;font:500 clamp(11px,1.35vw,23px)/1.3 Barlow,sans-serif;color:#cfe0ff;margin-top:.3em}@media(max-width:720px){#brand b{font-size:15px}#brand img{height:36px}}</style></head><body>
